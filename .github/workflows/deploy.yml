name: deploy

# Runs after a pull request merges. Builds and pushes any image whose tag is
# not already in the registry, then applies. The GitHub environment named dev
# holds the run until a reviewer approves it.
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Terraform locks state during an operation, so two runs racing means one
# dies on the lock. Queue them instead. Never cancel in progress: killing a
# running apply is how a state lease gets orphaned.
concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      # Full history so the build step can diff this push and tell whether
      # app source moved without its image tag moving with it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: init
        run: terraform init -input=false
        working-directory: terraform

      # Read the tags from the configuration rather than from state. State
      # still holds the previous values until the apply below succeeds, so
      # terraform output would return the tag being replaced.
      - name: read image tags
        id: tags
        working-directory: terraform
        run: |
          # terraform console writes diagnostics to stdout alongside the
          # result, so capturing everything picks up warnings too. The value
          # is the last line that looks like a quoted string. Anything else
          # is a failure rather than something to pass downstream.
          read_var() {
            echo "var.$1" | terraform console -no-color \n              | grep -E '^"[^"]+"$' | tail -1 | tr -d '"'
          }

          web=$(read_var web_image_tag)
          api=$(read_var api_image_tag)

          for v in "$web" "$api"; do
            if ! echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::could not read a version from terraform console, got: $v"
              exit 1
            fi
          done
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web:$web api:$api"

      - name: registry login
        run: az acr login --name ${{ vars.ACR_NAME }}

      # Tags are immutable, so an existing tag is never rebuilt or overwritten.
      # Bumping the variable in terraform is what triggers a build.
      - name: build and push changed images
        env:
          ACR: ${{ vars.ACR_NAME }}.azurecr.io
          WEB_TAG: ${{ steps.tags.outputs.web }}
          API_TAG: ${{ steps.tags.outputs.api }}
        run: |
          set -euo pipefail

          # Did this push touch the source for a service?
          changed() {
            local dir="$1"
            [ -n "$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- "$dir" 2>/dev/null)" ]
          }

          push_if_missing() {
            local repo="$1" tag="$2" context="$3"

            if az acr repository show \
                 --name "${{ vars.ACR_NAME }}" \
                 --image "$repo:$tag" >/dev/null 2>&1; then

              # Tags are immutable, so an existing tag is never rebuilt. If the
              # source changed anyway, the deployment would silently ship the
              # old image. Fail instead, because that mismatch is invisible
              # until something breaks at runtime.
              if changed "$context"; then
                echo "::error::$context changed in this push but $repo:$tag is already published."
                echo "::error::Bump the tag in terraform/variables.tf so the change is built and released."
                exit 1
              fi

              echo "$repo:$tag already published and $context unchanged, skipping build"
              return
            fi

            echo "building $repo:$tag"
            # The runner is amd64 and so is Container Apps, but the flag stays
            # explicit so the build does not silently follow the host.
            docker buildx build \
              --platform linux/amd64 \
              --tag "$ACR/$repo:$tag" \
              --push \
              "$context"
          }

          push_if_missing web "$WEB_TAG" ./app/web
          push_if_missing api "$API_TAG" ./app/api

      - name: apply
        working-directory: terraform
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform apply -input=false -auto-approve

      # Proves the deployment serves traffic before the run is called green.
      - name: smoke test
        working-directory: terraform
        run: |
          set -euo pipefail
          url=$(terraform output -raw web_container_app_url)
          echo "checking $url"
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url/" || true)
            [ "$code" = "200" ] && echo "site returned 200" && break
            echo "attempt $i returned $code, retrying"
            sleep 10
          done
          [ "$code" = "200" ]
          api=$(curl -s -o /dev/null -w "%{http_code}" "$url/api/status" || true)
          echo "api path returned $api"
          [ "$api" = "200" ]
