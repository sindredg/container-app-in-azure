name: terraform plan

# Runs on every pull request so the change is reviewed as a plan, not as
# guesswork. It never applies anything.
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

# id-token is what lets GitHub mint the OIDC token Entra trusts.
# Without it the login step fails with no credentials found.
permissions:
  id-token: write
  contents: read
  pull-requests: write

# Shares the state lock with the deploy workflow, so both sit in one queue.
concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # The backend uses the identity from azure/login, the same way the
      # local workflow uses az login.
      - name: init
        run: terraform init -input=false

      - name: fmt
        run: terraform fmt -check -recursive

      - name: validate
        run: terraform validate

      - name: plan
        id: plan
        run: |
          # Without pipefail the step reports tee's exit status, so a failing
          # plan would pass the check.
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_sql_admin_object_id: ${{ secrets.SQL_ADMIN_OBJECT_ID }}

      - name: comment plan on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let plan = fs.readFileSync("terraform/plan.txt", "utf8");

            // A comment body is capped at 65536 characters.
            const limit = 60000;
            if (plan.length > limit) {
              plan = plan.slice(-limit) + "\n\n(truncated, see the job log for the full plan)";
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "### Terraform plan\n\n```terraform\n" + plan + "\n```",
            });
