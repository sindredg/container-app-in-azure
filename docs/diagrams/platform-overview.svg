<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title description">
  <title id="title">Azure Container Apps: public web and internal API</title>
  <desc id="description">Browser HTTPS reaches public web ingress, which forwards HTTP on port 8080 to Nginx. Nginx proxies API requests over verified HTTPS with X-Api-Key to internal API ingress, which forwards HTTP on port 8080 to FastAPI. Direct requests from outside the environment to the API hostname receive an Azure ingress 404. Each app pulls registry images with its own repository-scoped managed identity. GitHub Actions signs in to Azure using OIDC, publishes images, and runs Terraform after approval. Terraform manages the platform with Blob Storage state and lease locking. Application console and platform logs go to Log Analytics. No custom VNet or Private Link is configured.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0b1426"/><stop offset="1" stop-color="#102338"/></linearGradient>
    <marker id="request-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65dfbd"/></marker>
    <marker id="control-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e9c684"/></marker>
    <marker id="log-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fbfff"/></marker>
    <marker id="blocked-end" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 2 2 L 10 10 M 2 10 L 10 2" fill="none" stroke="#f196a5" stroke-width="2"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #eaf2ff; }
      .heading { font-size: 27px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .detail { font-size: 15px; fill: #b5c8df; }
      .small { font-size: 14px; fill: #b5c8df; }
      .panel { fill: #101e32; stroke: #30445f; stroke-width: 1.5; }
      .node { fill: #193149; stroke: #466888; stroke-width: 1.5; }
      .request { fill: none; stroke: #65dfbd; stroke-width: 2.5; marker-end: url(#request-arrow); }
      .control { fill: none; stroke: #e9c684; stroke-width: 2; marker-end: url(#control-arrow); }
      .log { fill: none; stroke: #8fbfff; stroke-width: 2; marker-end: url(#log-arrow); }
      .blocked { fill: none; stroke: #f196a5; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#blocked-end); }
    </style>
  </defs>
